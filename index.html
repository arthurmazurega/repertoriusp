<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>repertoriusp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="repertoriusp">
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#0f1b33;--mut:#6b7893;--ln:#dde5f2;--ac:#2563eb;--hd:#0b1f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#131c33;--tx:#eaf0ff;--mut:#8a98b8;--ln:#24304d;--ac:#4f8cff;--hd:#050a18}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#131c33;--tx:#eaf0ff;--mut:#8a98b8;--ln:#24304d;--ac:#4f8cff;--hd:#050a18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:90px}
.hd{background:var(--hd);color:#fff;padding:18px 16px 16px;border-radius:0 0 24px 24px}
.w{max-width:640px;margin:0 auto}.hd .w{padding:0}.bd{padding:14px 16px}
h1{font-size:30px;margin:0 0 12px;font-weight:800;letter-spacing:-1px}h1 b{color:#7db0ff}
input,select,textarea,button{font:inherit;color:inherit}
.in{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
.hd .in{background:#ffffff1c;border-color:#ffffff30;color:#fff}.hd .in::placeholder{color:#ffffff99}
.tabs{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{flex:1;padding:8px;border:0;background:none;border-radius:9px;font-weight:600;color:var(--mut)}
.tab.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--card);font-size:14px;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:10px;margin-bottom:10px}
.cv{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff;overflow:hidden}
.cv img{width:100%;height:100%;object-fit:cover}
.inf{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px}
.g .cv{width:100%;height:auto;aspect-ratio:1;font-size:40px;margin-bottom:8px}
.bk{border:0;background:none;color:var(--ac);font-weight:600;padding:0 0 10px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 14px #0005}
.mod{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}.mod.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);font-weight:600}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:#dc2626}
.emp{text-align:center;color:var(--mut);padding:40px 10px}
.ft{display:flex;gap:10px;margin-top:20px}.ft .btn{font-size:14px;font-weight:500}
.pv{display:flex;gap:12px;align-items:center}.ck{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px}.ck input{width:20px;height:20px}
</style></head><body>
<div class="hd"><div class="w"><h1>repertori<b>usp</b></h1><input class="in" id="q" placeholder="Buscar música, artista ou álbum…" type="search"></div></div>
<div class="w bd">
<div class="tabs" id="tabs"><button class="tab on" data-v="m">Músicas</button><button class="tab" data-v="a">Artistas</button><button class="tab" data-v="b">Álbuns</button></div>
<div id="bk"></div><div class="chips" id="chips"></div>
<div id="list"></div>
<div class="ft"><button class="btn" id="ex">Exportar backup</button><button class="btn" id="im">Importar backup</button></div>
<input type="file" id="imf" accept="application/json" hidden>
</div>
<button class="fab" id="add" aria-label="Adicionar">+</button>
<div class="mod" id="mod"><div class="sh">
<h2 id="mt" style="margin:0">Nova música</h2>
<label>Capa</label><div class="pv"><div class="cv" id="pv"></div><button class="btn" id="pc" style="flex:none">Escolher foto</button><button class="btn" id="rc" style="flex:none">Remover</button></div>
<input type="file" id="cf" accept="image/*" hidden>
<label>Música</label><input class="in" id="ft">
<label>Artista</label><input class="in" id="fa">
<label>Álbum</label><input class="in" id="fb"><label class="ck"><input type="checkbox" id="fg"> É single (sem álbum)</label>
<label>Status</label><select class="in" id="fs"></select>
<label>Link da cifra / vídeo</label><input class="in" id="fl" type="url" inputmode="url" placeholder="https://…">
<label>Anotações (tom, trecho difícil…)</label><textarea class="in" id="fn" rows="3"></textarea>
<div class="row"><button class="btn d" id="del">Excluir</button><button class="btn" id="cn">Cancelar</button><button class="btn p" id="sv">Salvar</button></div>
</div></div>
<script>
const ST=[["Quero aprender","#7a869f"],["Aprendendo","#60a5fa"],["Toco com cifra","#3b82f6"],["Sei tocar","#2563eb"],["Mestre","#1e3a8a"]];
const K="repertorio-v1";let S=[],filt="Todas",cur=null,cov="",view="m",sel=null;
try{S=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){S=[]}
const $=i=>document.getElementById(i);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Não consegui salvar (armazenamento cheio?). Exporte um backup.")}}
function col(s){const x=ST.find(a=>a[0]===s);return x?x[1]:"#888"}
function hue(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%60;return`hsl(${210+h} 55% 42%)`}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cv(t,c,cls){return`<div class="cv ${cls||""}" style="background:${c?"none":hue(t)}">${c?`<img src="${c}" alt="">`:esc((t[0]||"?").toUpperCase())}</div>`}
const gk=s=>view==="a"?(s.a||"Sem artista"):(s.sg?"Singles":(s.al||"Sem álbum"));
const sub=s=>[s.a,s.sg?"Single":s.al].filter(Boolean).join(" · ")||"—";
function render(){
 const q=$("q").value.toLowerCase().trim();
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 const songsMode=view==="m"||sel!==null;
 $("bk").innerHTML=sel!==null?`<button class="bk" id="back">‹ ${view==="a"?"Artistas":"Álbuns"} · <b>${esc(sel)}</b></button>`:"";
 $("chips").style.display=songsMode?"":"none";
 if(songsMode){
  $("chips").innerHTML=["Todas",...ST.map(a=>a[0])].map(n=>{const c=n==="Todas"?S.length:S.filter(s=>s.s===n).length;return`<button class="chip${n===filt?" on":""}" data-f="${n}">${n} ${c}</button>`}).join("");
  const L=S.filter(s=>(sel===null||gk(s)===sel)&&(filt==="Todas"||s.s===filt)&&(!q||(s.t+" "+s.a+" "+s.al).toLowerCase().includes(q))).sort((a,b)=>a.t.localeCompare(b.t,"pt"));
  $("list").innerHTML=L.length?L.map(s=>`<div class="song" data-id="${s.id}">${cv(s.t,s.c)}<div class="inf"><div class="t">${esc(s.t)}</div><div class="a">${esc(sub(s))}</div><span class="b" style="background:${col(s.s)}">${s.s}</span></div>${s.l?`<a href="${esc(s.l)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:22px;text-decoration:none">🎼</a>`:""}</div>`).join(""):`<div class="emp">${S.length?"Nada encontrado.":"Nenhuma música ainda. Toque no + para começar."}</div>`;
 }else{
  const M={};S.forEach(s=>{(M[gk(s)]=M[gk(s)]||[]).push(s)});
  const G=Object.keys(M).filter(k=>!q||k.toLowerCase().includes(q)||M[k].some(s=>s.t.toLowerCase().includes(q))).sort((a,b)=>a.localeCompare(b,"pt"));
  $("list").innerHTML=G.length?`<div class="gr">${G.map(k=>{const c=(M[k].find(s=>s.c)||{}).c;return`<div class="g" data-g="${esc(k)}">${cv(k,c)}<div class="t">${esc(k)}</div><div class="a">${M[k].length} música${M[k].length>1?"s":""}</div></div>`}).join("")}</div>`:`<div class="emp">Nada por aqui ainda.</div>`;
 }
}
function open(id){
 cur=id?S.find(s=>s.id===id):null;const s=cur||{t:"",a:"",al:"",sg:false,s:"Aprendendo",l:"",n:"",c:""};
 $("mt").textContent=cur?"Editar música":"Nova música";
 $("ft").value=s.t;$("fa").value=s.a;$("fb").value=s.al||"";$("fg").checked=!!s.sg;$("fs").value=s.s;$("fl").value=s.l;$("fn").value=s.n;cov=s.c;
 sg();$("del").style.display=cur?"":"none";pv();$("mod").classList.add("on");
}
function sg(){$("fb").disabled=$("fg").checked;$("fb").style.opacity=$("fg").checked?.4:1}
function pv(){const t=$("ft").value||"?";$("pv").style.background=cov?"none":hue(t);$("pv").innerHTML=cov?`<img src="${cov}">`:esc(t[0].toUpperCase())}
$("fs").innerHTML=ST.map(a=>`<option>${a[0]}</option>`).join("");
$("ft").oninput=pv;$("fg").onchange=sg;
$("add").onclick=()=>open();
$("cn").onclick=()=>$("mod").classList.remove("on");
$("mod").onclick=e=>{if(e.target.id==="mod")$("mod").classList.remove("on")};
$("pc").onclick=()=>$("cf").click();$("rc").onclick=()=>{cov="";pv()};
$("cf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=160,c=document.createElement("canvas");c.width=c.height=z;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);cov=c.toDataURL("image/jpeg",.7);pv()};im.src=r.result};r.readAsDataURL(f);e.target.value=""};
$("sv").onclick=()=>{const t=$("ft").value.trim();if(!t){$("ft").focus();return}
 const g=$("fg").checked,o={t,a:$("fa").value.trim(),al:g?"":$("fb").value.trim(),sg:g,s:$("fs").value,l:$("fl").value.trim(),n:$("fn").value.trim(),c:cov};
 if(cur)Object.assign(cur,o);else S.push({id:Date.now().toString(36),...o});
 save();$("mod").classList.remove("on");render()};
$("del").onclick=()=>{if(cur&&confirm("Excluir esta música?")){S=S.filter(s=>s!==cur);save();$("mod").classList.remove("on");render()}};
$("q").oninput=render;
$("tabs").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;sel=null;render()}};
$("bk").onclick=e=>{if(e.target.closest("#back")){sel=null;render()}};
$("chips").onclick=e=>{const f=e.target.dataset.f;if(f){filt=f;render()}};
$("list").onclick=e=>{const g=e.target.closest(".g");if(g){sel=g.dataset.g;render();return}const d=e.target.closest(".song");if(d)open(d.dataset.id)};
$("ex").onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="repertoriusp-backup.json";a.click()};
$("im").onclick=()=>$("imf").click();
$("imf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(confirm(`Importar ${d.length} músicas? Isso substitui a lista atual.`)){S=d;save();render()}}catch(x){alert("Arquivo inválido.")}};r.readAsText(f);e.target.value=""};
render();
</script></body></html>
