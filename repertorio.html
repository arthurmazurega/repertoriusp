<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>repertoriusp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="repertoriusp">
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#0f1b33;--mut:#6b7893;--ln:#dde5f2;--ac:#2563eb;--hd:#0b1f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#131c33;--tx:#eaf0ff;--mut:#8a98b8;--ln:#24304d;--ac:#4f8cff;--hd:#050a18}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#131c33;--tx:#eaf0ff;--mut:#8a98b8;--ln:#24304d;--ac:#4f8cff;--hd:#050a18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:90px}
.hd{background:var(--hd);color:#fff;padding:18px 16px 16px;border-radius:0 0 24px 24px}
.w{max-width:640px;margin:0 auto}.hd .w{padding:0}.bd{padding:14px 16px}
h1{font-size:30px;margin:0 0 12px;font-weight:800;letter-spacing:-1px}h1 b{color:#7db0ff}
input,select,textarea,button{font:inherit;color:inherit}
.in{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
.hd .in{background:#ffffff1c;border-color:#ffffff30;color:#fff}.hd .in::placeholder{color:#ffffff99}
.tabs{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{flex:1;padding:8px;border:0;background:none;border-radius:9px;font-weight:600;color:var(--mut)}
.tab.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--card);font-size:14px;white-space:nowrap;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:10px;margin-bottom:10px}
.cv{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff;overflow:hidden}
.cv{position:relative}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sgl{border:1px solid var(--ln);border-radius:10px;background:var(--card);margin-top:4px;overflow:hidden}.sgl button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--ln);background:none}.sgl small{color:var(--mut)}
.inf{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px}
.g .cv{width:100%;height:auto;aspect-ratio:1;font-size:40px;margin-bottom:8px}
.bk{border:0;background:none;color:var(--ac);font-weight:600;padding:0 0 10px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 14px #0005}
.mod{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}.mod.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);font-weight:600}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:#dc2626}
.emp{text-align:center;color:var(--mut);padding:40px 10px}
.ft{display:flex;gap:10px;margin-top:20px}.ft .btn{font-size:14px;font-weight:500}
.tg{display:inline-block;margin:4px 0 0 4px;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--ac);color:var(--ac)}#fi{display:grid;grid-template-columns:1fr 1fr}#fi label{margin:8px 0 0}
.pv{display:flex;gap:12px;align-items:center}.ck{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px}.ck input{width:20px;height:20px}
</style></head><body>
<div class="hd"><div class="w"><h1>repertori<b>usp</b></h1><input class="in" id="q" placeholder="Buscar música, artista ou álbum…" type="search"></div></div>
<div class="w bd">
<div class="tabs" id="tabs"><button class="tab on" data-v="m">Músicas</button><button class="tab" data-v="a">Artistas</button><button class="tab" data-v="b">Álbuns</button></div>
<div id="bk"></div><select class="in" id="so" style="margin-bottom:10px"><option value="t">Ordenar: Música (A–Z)</option><option value="a">Ordenar: Artista</option><option value="b">Ordenar: Álbum</option><option value="n">Ordenar: Nível (maior primeiro)</option><option value="m">Ordenar: Nível (menor primeiro)</option><option value="r">Ordenar: Adicionadas por último</option></select><div class="chips" id="chips"></div>
<div class="chips" id="chi"></div>
<div id="list"></div>
<div class="ft"><button class="btn" id="ex">Exportar backup</button><button class="btn" id="im">Importar backup</button></div>
<input type="file" id="imf" accept="application/json" hidden>
</div>
<button class="fab" id="add" aria-label="Adicionar">+</button>
<div class="mod" id="mod"><div class="sh">
<h2 id="mt" style="margin:0">Nova música</h2>
<label>Capa (se vazia, usa a do álbum ou a foto do artista)</label><div class="pv"><div class="cv" id="pv"></div><button class="btn" id="pc" style="flex:none">Escolher foto</button><button class="btn" id="rc" style="flex:none">Remover</button></div>
<input type="file" id="cf" accept="image/*" hidden><input type="file" id="af" accept="image/*" hidden>
<label>Música</label><input class="in" id="ft">
<label>Artista</label><input class="in" id="fa" autocomplete="off"><div id="sa"></div><button class="btn" id="pa" style="margin-top:8px;width:100%;font-weight:500">Foto do artista</button>
<label>Álbum</label><input class="in" id="fb" autocomplete="off"><div id="sb"></div><label class="ck"><input type="checkbox" id="fg"> É single (sem álbum)</label>
<label>Instrumento (marque um ou mais)</label><div id="fi"></div>
<label>Status</label><select class="in" id="fs"></select>
<label>Link da cifra / vídeo</label><input class="in" id="fl" type="url" inputmode="url" placeholder="https://…">
<label>Anotações (tom, trecho difícil…)</label><textarea class="in" id="fn" rows="3"></textarea>
<div class="row"><button class="btn d" id="del">Excluir</button><button class="btn" id="cn">Cancelar</button><button class="btn p" id="sv">Salvar</button></div>
</div></div>
<script>
const ST=[["Quero aprender","#f97316"],["Aprendendo","#facc15"],["Toco com cifra","#16a34a"],["Sei tocar","#2563eb"],["Mestre","#9333ea"]];
const IN=["Piano","Guitarra ritmo","Guitarra solo","Outro"];
const K="repertorio-v1";let S=[],fi="Todos",filt="Todas",cur=null,cov="",view="m",sel=null;
try{S=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){S=[]}
const KP="repertorio-artistas-v1";let P={},apn="";
try{P=JSON.parse(localStorage.getItem(KP)||"{}")}catch(e){P={}}
const ak=a=>(a||"").trim().toLowerCase();
function saveP(){try{localStorage.setItem(KP,JSON.stringify(P))}catch(e){alert("Não consegui salvar a foto (armazenamento cheio?). Exporte um backup.")}}
let CA={artists:[],albums:[]};
fetch("catalog.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{if(j){CA={artists:j.artists||[],albums:j.albums||[]};render()}}).catch(()=>{});
const catImg=(t,n,a)=>{const c=(t==="a"?CA.artists:CA.albums).find(x=>ak(x.name)===ak(n)&&(t==="a"||!x.artist||!a||ak(x.artist)===ak(a)));return c&&c.img||""};
const lc=(x,y)=>(x||"\uffff").localeCompare(y||"\uffff","pt");
function cmp(a,b){const o=$("so").value,ix=s=>ST.findIndex(x=>x[0]===s.s);let r=0;
 if(o==="a")r=lc(a.a,b.a)||lc(a.sg?"":a.al,b.sg?"":b.al);
 else if(o==="b")r=lc(a.sg?"":a.al,b.sg?"":b.al)||lc(a.a,b.a);
 else if(o==="n")r=ix(b)-ix(a);else if(o==="m")r=ix(a)-ix(b);
 else if(o==="r")r=parseInt(b.id,36)-parseInt(a.id,36);
 return r||(a.t||"").localeCompare(b.t||"","pt")}
function eff(s,ex){if(s.c)return s.c;if(!s.sg&&s.al){const m=S.find(x=>x!==s&&x!==ex&&x.c&&!x.sg&&x.al&&ak(x.al)===ak(s.al)&&ak(x.a)===ak(s.a));if(m)return m.c}return(!s.sg&&s.al&&catImg("b",s.al,s.a))||P[ak(s.a)]||catImg("a",s.a)}
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=160,c=document.createElement("canvas");c.width=c.height=z;const m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)}
function pickArtist(n){apn=n;$("af").click()}
const $=i=>document.getElementById(i);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert("Não consegui salvar (armazenamento cheio?). Exporte um backup.")}}
const CC={};let ccT=0;
function dom(im){const c=document.createElement("canvas");c.width=c.height=24;const x=c.getContext("2d");x.drawImage(im,0,0,24,24);let d;try{d=x.getImageData(0,0,24,24).data}catch(e){return""}
 let q1=0,q2=0,q3=0,W=0;for(let i=0;i<d.length;i+=4){const w=.1+(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]))/255;q1+=d[i]*w;q2+=d[i+1]*w;q3+=d[i+2]*w;W+=w}
 const r=q1/W/255,g=q2/W/255,b=q3/W/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),dl=mx-mn;let h=0,l=(mx+mn)/2,s=dl?dl/(1-Math.abs(2*l-1)):0;
 if(dl){h=mx===r?((g-b)/dl)%6:mx===g?(b-r)/dl+2:(r-g)/dl+4;h=(h*60+360)%360}
 l=Math.min(.6,Math.max(.4,l));if(s>.1)s=Math.max(.35,Math.min(.85,s));
 return`hsl(${Math.round(h)} ${Math.round(s*100)}% ${Math.round(l*100)}%)`}
function ac(s){const src=eff(s);if(!src)return col(s.s);const c=CC[src];if(c)return c;if(c===undefined){CC[src]=null;const im=new Image();im.onload=()=>{CC[src]=dom(im);clearTimeout(ccT);ccT=setTimeout(render,60)};im.onerror=()=>{CC[src]=""};im.src=src}return col(s.s)}
function col(s){const x=ST.find(a=>a[0]===s);return x?x[1]:"#888"}
function hue(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%60;return`hsl(${210+h} 55% 42%)`}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cv(t,c,cls){return`<div class="cv ${cls||""}" style="background:${hue(t)}">${esc((t[0]||"?").toUpperCase())}${c?`<img src="${c}" alt="" onerror="this.remove()">`:""}</div>`}
const gk=s=>view==="a"?(s.a||"Sem artista"):(s.sg?"Singles":(s.al||"Sem álbum"));
const sub=s=>[s.a,s.sg?"Single":s.al].filter(Boolean).join(" · ")||"—";
function render(){
 const q=$("q").value.toLowerCase().trim();
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 const songsMode=view==="m"||sel!==null;
 $("bk").innerHTML=sel!==null?`<button class="bk" id="back">‹ ${view==="a"?"Artistas":"Álbuns"} · <b>${esc(sel)}</b></button>`+(view==="a"&&sel!=="Sem artista"?`<div class="pv" style="margin-bottom:12px">${cv(sel,P[ak(sel)]||catImg("a",sel))}<button class="btn" id="ap" style="flex:none">Foto do artista</button>${P[ak(sel)]?`<button class="btn" id="ar" style="flex:none">Remover</button>`:""}</div>`:""):"";
 $("chips").style.display=$("chi").style.display=songsMode?"":"none";
 if(songsMode){
  $("chips").innerHTML=["Todas",...ST.map(a=>a[0])].map(n=>{const c=n==="Todas"?S.length:S.filter(s=>s.s===n).length;return`<button class="chip${n===filt?" on":""}" data-f="${n}">${n} ${c}</button>`}).join("");
  $("chi").innerHTML=["Todos",...IN].map(n=>`<button class="chip${n===fi?" on":""}" data-i="${n}">${n=="Todos"?"Todos instrumentos":n}</button>`).join("");
  $("so").style.display="";const L=S.filter(s=>(sel===null||gk(s)===sel)&&(fi==="Todos"||(s.i||[]).includes(fi))&&(filt==="Todas"||s.s===filt)&&(!q||(s.t+" "+s.a+" "+s.al).toLowerCase().includes(q))).sort(cmp);
  $("list").innerHTML=L.length?L.map(s=>`<div class="song" data-id="${s.id}" style="border-left-color:${ac(s)}">${cv(s.t,eff(s))}<div class="inf"><div class="t">${esc(s.t)}</div><div class="a">${esc(sub(s))}</div><span class="b" style="background:${col(s.s)};color:${s.s==="Aprendendo"?"#3a2f00":"#fff"}">${s.s}</span>${(s.i||[]).map(x=>`<span class="tg">${x}</span>`).join("")}</div>${s.l?`<a href="${esc(s.l)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:22px;text-decoration:none">🎼</a>`:""}</div>`).join(""):`<div class="emp">${S.length?"Nada encontrado.":"Nenhuma música ainda. Toque no + para começar."}</div>`;
 }else{
  const M={};S.forEach(s=>{(M[gk(s)]=M[gk(s)]||[]).push(s)});
  $("so").style.display="none";const G=Object.keys(M).filter(k=>!q||k.toLowerCase().includes(q)||M[k].some(s=>s.t.toLowerCase().includes(q))).sort((a,b)=>a.localeCompare(b,"pt"));
  $("list").innerHTML=G.length?`<div class="gr">${G.map(k=>{const c=view==="a"&&(P[ak(k)]||catImg("a",k))?(P[ak(k)]||catImg("a",k)):(M[k].map(s=>eff(s)).find(Boolean)||"");return`<div class="g" data-g="${esc(k)}">${cv(k,c)}<div class="t">${esc(k)}</div><div class="a">${M[k].length} música${M[k].length>1?"s":""}</div></div>`}).join("")}</div>`:`<div class="emp">Nada por aqui ainda.</div>`;
 }
}
function open(id){
 cur=id?S.find(s=>s.id===id):null;const s=cur||{t:"",a:"",al:"",sg:false,s:"Aprendendo",i:[],l:"",n:"",c:""};
 $("mt").textContent=cur?"Editar música":"Nova música";
 $("ft").value=s.t;$("fa").value=s.a;$("fb").value=s.al||"";$("fg").checked=!!s.sg;$("fs").value=s.s;document.querySelectorAll("#fi input").forEach(c=>c.checked=(s.i||[]).includes(c.value));$("fl").value=s.l;$("fn").value=s.n;cov=s.c;
 sg();$("del").style.display=cur?"":"none";pv();$("mod").classList.add("on");
}
function sg(){$("fb").disabled=$("fg").checked;$("fb").style.opacity=$("fg").checked?.4:1}
function pv(){const t=$("ft").value||"?",c=eff({c:cov,al:$("fb").value,sg:$("fg").checked,a:$("fa").value},cur);$("pv").style.background=hue(t);$("pv").innerHTML=esc(t[0].toUpperCase())+(c?`<img src="${c}" onerror="this.remove()">`:"")}
$("fi").innerHTML=IN.map(n=>`<label class="ck"><input type="checkbox" value="${n}"> ${n}</label>`).join("");
$("fs").innerHTML=ST.map(a=>`<option>${a[0]}</option>`).join("");
$("ft").oninput=$("fa").oninput=$("fb").oninput=pv;$("fg").onchange=()=>{sg();pv()};
const uq=a=>{const m=new Map();a.forEach(x=>{if(x.name&&!m.has(ak(x.name)))m.set(ak(x.name),x)});return[...m.values()]};
const nz=x=>ak(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function sug(inp,box,list,pick){const el=$(inp),bx=$(box);
 el.addEventListener("input",()=>{const q=nz(el.value);const L=q?list().filter(x=>nz(x.name).includes(q)&&nz(x.name)!==q).slice(0,6):[];
  bx.innerHTML=L.length?`<div class="sgl">${L.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.name)}${x.artist?` <small>· ${esc(x.artist)}</small>`:""}</button>`).join("")}</div>`:"";
  bx.onclick=e=>{const b=e.target.closest("button");if(b){pick(L[b.dataset.i]);bx.innerHTML="";pv()}}});
 el.addEventListener("blur",()=>setTimeout(()=>bx.innerHTML="",250))}
sug("fa","sa",()=>uq([...CA.artists,...S.map(s=>({name:s.a}))]),x=>{$("fa").value=x.name});
sug("fb","sb",()=>{const a=ak($("fa").value);return uq([...CA.albums,...S.filter(s=>s.al&&!s.sg).map(s=>({name:s.al,artist:s.a}))]).filter(x=>!a||!x.artist||ak(x.artist)===a)},x=>{$("fb").value=x.name;if(!$("fa").value&&x.artist)$("fa").value=x.artist;$("fg").checked=false;sg()});
$("pa").onclick=()=>{if(!$("fa").value.trim()){alert("Preencha o artista primeiro.");return}pickArtist($("fa").value)};
$("af").onchange=e=>{const f=e.target.files[0];if(f)readImg(f,d=>{P[ak(apn)]=d;saveP();render();if($("mod").classList.contains("on"))pv()});e.target.value=""};
$("add").onclick=()=>open();
$("cn").onclick=()=>$("mod").classList.remove("on");
$("mod").onclick=e=>{if(e.target.id==="mod")$("mod").classList.remove("on")};
$("pc").onclick=()=>$("cf").click();$("rc").onclick=()=>{cov="";pv()};
$("cf").onchange=e=>{const f=e.target.files[0];if(f)readImg(f,d=>{cov=d;pv()});e.target.value=""};
$("sv").onclick=()=>{const t=$("ft").value.trim();if(!t){$("ft").focus();return}
 const g=$("fg").checked,o={t,a:$("fa").value.trim(),al:g?"":$("fb").value.trim(),sg:g,s:$("fs").value,i:[...document.querySelectorAll("#fi input:checked")].map(c=>c.value),l:$("fl").value.trim(),n:$("fn").value.trim(),c:cov};
 if(cur)Object.assign(cur,o);else S.push({id:Date.now().toString(36),...o});
 save();$("mod").classList.remove("on");render()};
$("del").onclick=()=>{if(cur&&confirm("Excluir esta música?")){S=S.filter(s=>s!==cur);save();$("mod").classList.remove("on");render()}};
$("q").oninput=render;
$("tabs").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;sel=null;render()}};
$("bk").onclick=e=>{if(e.target.closest("#back")){sel=null;render()}else if(e.target.closest("#ap"))pickArtist(sel);else if(e.target.closest("#ar")){delete P[ak(sel)];saveP();render()}};
try{$("so").value=localStorage.getItem("repertoriusp-ord")||"t"}catch(e){}
$("so").onchange=()=>{try{localStorage.setItem("repertoriusp-ord",$("so").value)}catch(e){}render()};
$("chi").onclick=e=>{const f=e.target.dataset.i;if(f){fi=f;render()}};
$("chips").onclick=e=>{const f=e.target.dataset.f;if(f){filt=f;render()}};
$("list").onclick=e=>{const g=e.target.closest(".g");if(g){sel=g.dataset.g;render();return}const d=e.target.closest(".song");if(d)open(d.dataset.id)};
$("ex").onclick=()=>{const b=new Blob([JSON.stringify({songs:S,artists:P})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="repertoriusp-backup.json";a.click()};
$("im").onclick=()=>$("imf").click();
$("imf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=Array.isArray(j)?j:j.songs;if(!Array.isArray(d))throw 0;if(confirm(`Importar ${d.length} músicas? Isso substitui a lista atual.`)){S=d;if(!Array.isArray(j)){P=j.artists||{};saveP()}save();render()}}catch(x){alert("Arquivo inválido.")}};r.readAsText(f);e.target.value=""};
render();
</script></body></html>
